[package]
name = "tauri-plugin-stash-android"
version = "0.1.0"
description = "Android side of Stash (Kotlin)"
edition = "2024"
links = "tauri-plugin-stash-android"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
