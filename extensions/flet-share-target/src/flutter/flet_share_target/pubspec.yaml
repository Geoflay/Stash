name: flet_share_target
description: Receive the links shared to a Flet app from other Android apps.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flet: 1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.videodownloader.sharetarget
        pluginClass: ShareTargetPlugin
