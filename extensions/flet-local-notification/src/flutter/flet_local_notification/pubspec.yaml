name: flet_local_notification
description: Show Android notifications from a Flet app.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flet: 1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: com.videodownloader.localnotification
        pluginClass: LocalNotificationPlugin
